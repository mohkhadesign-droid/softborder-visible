name: Build

# Builds the mod on GitHub's runners, which have the network access that maven.minecraftforge.net
# requires. Use this if you would rather not install JDK 8 and Gradle 7 locally.
#
# Before the first run you must make the Soft Borders jar available to the build:
#   git add -f libs/softborder-1.5.2.jar
# (.gitignore excludes libs/*.jar by default, so -f is required.)
#
# The finished jar appears under the run's "Artifacts" as sbvisible-jar.

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to publish the finished jar into dist/
    steps:
      - uses: actions/checkout@v4

      - name: Check the Soft Borders jar is present
        run: |
          if ! ls libs/softborder-*.jar >/dev/null 2>&1; then
            echo "::error::libs/softborder-1.5.2.jar is missing. The build compiles against Soft Borders' public API, so the jar must be committed: git add -f libs/softborder-1.5.2.jar"
            exit 1
          fi
          ls -l libs/

      # ForgeGradle 5.1 and the 1.16.5 toolchain require Java 8.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      # ForgeGradle 5.1 does not support Gradle 8, and this repo ships no wrapper, so pin Gradle 7.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.4.2'

      - name: Build
        run: gradle build --no-daemon --stacktrace

      - name: Inspect the built jar
        run: |
          set -e
          JAR=$(ls build/libs/*.jar | head -1)
          echo "jar: $JAR"
          sha256sum "$JAR"
          echo "--- contents ---"
          unzip -l "$JAR"
          echo "--- mods.toml ---"
          unzip -p "$JAR" META-INF/mods.toml
          echo "--- reobfuscation: production jars must carry SRG (func_/field_) names ---"
          # Scan every client class rather than naming one: a hardcoded class name silently turns
          # this check into a false failure the moment that class is renamed or removed.
          WORK=$(mktemp -d)
          unzip -oq "$JAR" -d "$WORK"
          if grep -raqE 'func_[0-9]+_|field_[0-9]+_' "$WORK/sbvisible/client/"; then
            echo "OK: SRG names present, so reobfJar ran and this jar will load outside the dev workspace"
          else
            echo "FAIL: no SRG names found - jar is still dev-mapped and would crash in a normal install"
            exit 1
          fi
          echo "--- Soft Borders must NOT be bundled (the player's own install provides it) ---"
          if unzip -l "$JAR" | grep -q 'jackiecrazy/'; then
            echo "FAIL: Soft Borders classes are bundled into this jar"
            exit 1
          fi
          echo "OK: no jackiecrazy/ classes in the jar"
          echo "--- client-only classes must exist, and nothing else may ---"
          unzip -l "$JAR" | grep -c 'sbvisible/' || true

      - uses: actions/upload-artifact@v4
        with:
          name: sbvisible-jar
          path: build/libs/*.jar
          if-no-files-found: error

      # Also commit the jar into dist/ so it can be downloaded straight from the repo's file
      # tree, without going through the Actions artifact UI. Pushes made with GITHUB_TOKEN do
      # not retrigger workflows, and [skip ci] is belt-and-braces.
      - name: Publish the jar into dist/
        run: |
          set -e
          mkdir -p dist
          rm -f dist/*.jar
          cp build/libs/*.jar dist/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # -A so a removed older jar is staged as a deletion too; `add dist/*.jar` only ever
          # stages files that still exist, which silently leaves stale versions in the repo.
          git add -A -f dist
          if git diff --cached --quiet; then
            echo "dist/ already up to date"
          else
            git commit -m "CI: publish built jar to dist/ [skip ci]"
            git push
          fi
